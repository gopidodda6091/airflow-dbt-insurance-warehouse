# Tooling config only. Dependencies are pinned in requirements*.txt because Airflow and
# dbt need separate environments (their pinned dependencies conflict).
[project]
name = "airflow-dbt-insurance-warehouse"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Gopi Dodda" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv-airflow", "dbt/target", "dbt/dbt_packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
